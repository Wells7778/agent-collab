[project]
name = "agenthub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "PyYAML>=6", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agenthub"]
